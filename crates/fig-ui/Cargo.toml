[package]
name = "fig-ui"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
description = "Fig's editor window, on Rune"

[[bin]]
name = "fig"
path = "src/main.rs"

[features]
default = ["audio"]
# Sound through the audio device (cpal). Linux needs the ALSA headers to build it (alsa-lib-devel); without it
# playback runs on a wall clock, silently.
audio = ["dep:cpal"]

[dependencies]
fig-timeline = { path = "../fig-timeline" }
fig-edit = { path = "../fig-edit" }
fig-project = { path = "../fig-project" }
fig-media = { path = "../fig-media" }
fig-fx = { path = "../fig-fx" }
fig-render = { path = "../fig-render" }
fig-captions = { path = "../fig-captions" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
cpal = { version = "0.18", optional = true }
rune = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", features = ["native-file-dialog"] }

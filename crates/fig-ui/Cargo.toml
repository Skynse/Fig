[package]
name = "fig-ui"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
description = "Fig's Rust UI: the Avalonia app's 1:1 port, on Rune"

[[bin]]
name = "fig"
path = "src/main.rs"

[features]
# Playback audio needs ALSA headers on Linux; the timer clock keeps the port buildable without them.
default = []
audio = []

[dependencies]
fig-timeline = { path = "../fig-timeline" }
fig-edit = { path = "../fig-edit" }
fig-project = { path = "../fig-project" }
fig-media = { path = "../fig-media" }
fig-fx = { path = "../fig-fx" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", features = ["native-file-dialog"] }

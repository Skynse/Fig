# Builds a major version and publishes it as a GitHub release:
#   Fig-<v>-linux-x64.AppImage    one file with FFmpeg inside: chmod +x and run it; it adds itself to the app menu
#                                 (fig --uninstall takes it out)
#
#   git tag v2.0.0 && git push origin v2.0.0
#
# Only vN.0.0 tags start it. Run it by hand from the Actions tab to build any version; leave "publish" off to
# get the AppImage as a workflow artifact without making a release.
name: Release

on:
  push:
    tags: ['v[0-9]+.0.0']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the v (e.g. 2.0.0)
        required: true
      publish:
        description: Publish it as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$v' is not a version like 2.0.0"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      # the version the app reports (fig's and its MCP server's) is the tag's
      - run: |
          for c in fig-ui fig-mcp; do
            sed -i '0,/^version = .*/s//version = "${{ steps.v.outputs.version }}"/' crates/$c/Cargo.toml
          done
      - run: cargo build --release -p fig-ui
      - run: packaging/linux/appimage.sh ${{ steps.v.outputs.version }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: Fig-${{ steps.v.outputs.version }}-linux-x64
          path: dist/*
          if-no-files-found: error
      - name: Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum Fig-* > SHA256SUMS
          gh release create "v${{ steps.v.outputs.version }}" Fig-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fig ${{ steps.v.outputs.version }}" --generate-notes

# What every Fig build needs: system packages, the pinned Rust toolchain, a warm cargo cache and FFmpeg 8.1.
name: Set up the Fig build
description: System packages, Rust from rust-toolchain.toml, cargo cache, FFmpeg
inputs:
  cache-key:
    description: Separates the cargo caches of jobs that build differently (debug, release, clippy)
    default: debug
runs:
  using: composite
  steps:
    - name: System packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        # clang/libclang: FFmpeg's bindings. cmake: whisper.cpp. ALSA/Pulse: sound. The rest: Rune's window and text.
        # patchelf: the AppImage. mesa-vulkan-drivers: a software GPU for tests that render. libva/vdpau/OpenCL/VPL:
        # BtbN's FFmpeg loads the hardware-acceleration libraries at startup and aborts without them (desktops have them).
        sudo apt-get install -y -qq --no-install-recommends \
          clang libclang-dev cmake pkg-config libasound2-dev libpulse-dev libfontconfig-dev libxkbcommon-dev \
          libwayland-dev libudev-dev patchelf mesa-vulkan-drivers \
          libva2 libva-drm2 libva-x11-2 libvdpau1 ocl-icd-libopencl1 libvpl2 > /dev/null
    # the runner's LLVM, for FFmpeg's bindings (bindgen); cmake and the MSVC tools are already there
    - name: libclang (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
    - name: Rust
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
    - name: FFmpeg
      shell: bash
      run: source ci/ffmpeg.sh
